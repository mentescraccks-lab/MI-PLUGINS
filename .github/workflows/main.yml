name: Build AndresBeats Clip (VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: AndresBeatsClip-VST3-${{ matrix.os }}
          path: build/AndresBeatsClip_artefacts/Release/VST3/
