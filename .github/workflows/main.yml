name: Build AndresBeats Clip (VST3)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        with:
          name: AndresBeatsClip-VST3-Windows
          path: build/AndresBeatsClip_artefacts/Release/VST3/
